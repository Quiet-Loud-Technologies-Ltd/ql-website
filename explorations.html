document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0d1e2031-552c-479c-81d4-8eb5f8c51746\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════\n   SECTION EXPLORATIONS — base / canvas / shared\n   Quiet Loud dark system, presented on a light canvas\n════════════════════════════════════════════════ */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\n\n:root {\n  /* canvas (light) */\n  --canvas:    #e8e6e0;\n  --canvas2:   #f1efe9;\n  --canvas-ink:#2a2722;\n  --canvas-soft:#6b6760;\n  /* dark system (inside frames) */\n  --bg:       #0f0e0c;\n  --bg2:      #161512;\n  --bg3:      #1c1a17;\n  --bg4:      #231f1a;\n  --ink:      #f4f2ec;\n  --ink-soft: #b8b4a8;\n  --ink-faint:#6b6760;\n  --line:     #2a2722;\n  --line2:    #332f29;\n  --accent:   #7c3aed;\n  --accent-dim:#5b2ab0;\n  --accent-bright:#9a5cff;\n  --accent-glow: rgba(124,58,237,.18);\n  --red:      #c0492f;\n  --green:    #34d399;\n  --ff-head:  'Plus Jakarta Sans', sans-serif;\n  --ff-body:  'Plus Jakarta Sans', sans-serif;\n  --ff-mono:  'Space Mono', monospace;\n  --ease:        cubic-bezier(.16, 1, .3, 1);\n  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);\n}\n\nbody {\n  background:\n    radial-gradient(120% 80% at 50% -10%, var(--canvas2), var(--canvas)) fixed;\n  color: var(--canvas-ink);\n  font-family: var(--ff-body);\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  padding: 56px 40px 120px;\n}\n\n/* ─── PAGE HEADER ─── */\n.ex-head {\n  max-width: 1240px;\n  margin: 0 auto 48px;\n}\n.ex-kicker {\n  font-family: var(--ff-mono);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--canvas-soft);\n  margin-bottom: 16px;\n}\n.ex-head h1 {\n  font-family: var(--ff-head);\n  font-size: clamp(30px, 4vw, 46px);\n  font-weight: 500;\n  letter-spacing: -.03em;\n  line-height: 1.04;\n  color: var(--canvas-ink);\n  max-width: 22ch;\n  margin-bottom: 16px;\n}\n.ex-head p {\n  font-size: 17px;\n  color: var(--canvas-soft);\n  max-width: 64ch;\n}\n.ex-head .ex-legend {\n  margin-top: 22px;\n  display: flex;\n  gap: 10px;\n  flex-wrap: wrap;\n}\n.ex-legend-pill {\n  font-family: var(--ff-mono);\n  font-size: 11px;\n  letter-spacing: .04em;\n  border: 1px solid rgba(0,0,0,.14);\n  background: rgba(255,255,255,.5);\n  border-radius: 20px;\n  padding: 5px 13px;\n  color: var(--canvas-soft);\n}\n\n/* ─── GROUPS ─── */\n.ex-group { max-width: 1240px; margin: 0 auto 72px; }\n.ex-group-head {\n  display: flex;\n  align-items: baseline;\n  gap: 16px;\n  padding-bottom: 14px;\n  margin-bottom: 28px;\n  border-bottom: 1px solid rgba(0,0,0,.12);\n}\n.ex-group-id {\n  font-family: var(--ff-mono);\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--accent);\n  letter-spacing: .04em;\n}\n.ex-group-head h2 {\n  font-family: var(--ff-head);\n  font-size: 22px;\n  font-weight: 600;\n  letter-spacing: -.02em;\n  color: var(--canvas-ink);\n}\n.ex-group-head .note {\n  margin-left: auto;\n  font-size: 13px;\n  color: var(--canvas-soft);\n  font-family: var(--ff-mono);\n}\n\n/* ─── FRAME (one option) ─── */\n.frame { margin-bottom: 40px; }\n.frame-label {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  flex-wrap: wrap;\n  margin-bottom: 14px;\n}\n.frame-tag {\n  font-family: var(--ff-mono);\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: #fff;\n  background: var(--accent);\n  border-radius: 6px;\n  padding: 3px 9px;\n}\n.frame-label h3 {\n  font-family: var(--ff-head);\n  font-size: 17px;\n  font-weight: 600;\n  letter-spacing: -.01em;\n  color: var(--canvas-ink);\n  white-space: nowrap;\n  flex-shrink: 0;\n}\n.frame-label p {\n  font-size: 13.5px;\n  color: var(--canvas-soft);\n  margin-left: 4px;\n}\n.frame-label .hint {\n  margin-left: auto;\n  font-family: var(--ff-mono);\n  font-size: 11px;\n  color: var(--accent);\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n.frame-label .hint::before {\n  content: '';\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 8px var(--accent);\n}\n\n/* the dark stage that holds a section */\n.qframe {\n  position: relative;\n  background: var(--bg);\n  border: 1px solid rgba(0,0,0,.16);\n  border-radius: 18px;\n  overflow: hidden;\n  box-shadow: 0 24px 60px -24px rgba(0,0,0,.45);\n}\n.qframe::after { /* grain */\n  content: '';\n  position: absolute; inset: 0;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E\");\n  opacity: .03;\n  pointer-events: none;\n  z-index: 50;\n}\n.qpad { padding: 64px 56px; }\n\n/* ─── shared dark-section typography / atoms ─── */\n.qframe .eyebrow {\n  font-family: var(--ff-mono);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--ink-faint);\n}\n.qframe h2 {\n  font-family: var(--ff-head);\n  font-size: clamp(28px, 3.2vw, 40px);\n  font-weight: 500;\n  letter-spacing: -.025em;\n  line-height: 1.08;\n  color: var(--ink);\n}\n.qframe h3 {\n  font-family: var(--ff-head);\n  font-size: 20px;\n  font-weight: 600;\n  letter-spacing: -.02em;\n  color: var(--ink);\n}\n.qframe p { color: var(--ink-soft); }\n\n.q-btn {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: var(--ff-body);\n  font-size: 14px; font-weight: 600;\n  color: var(--ink);\n  background: var(--bg3);\n  border: 1.5px solid var(--line2);\n  border-radius: 11px;\n  padding: 11px 18px;\n  cursor: pointer;\n  transition: border-color .2s, background .2s, transform .3s var(--ease-spring);\n}\n.q-btn:hover { border-color: var(--ink-faint); background: var(--bg4); transform: translateY(-2px); }\n.q-btn .ar { transition: transform .35s var(--ease-spring); }\n.q-btn:hover .ar { transform: translateX(4px); }\n\n.q-badge {\n  display: inline-flex; align-items: center; gap: 9px;\n  font-family: var(--ff-mono);\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--accent);\n  background: rgba(124,58,237,.1);\n  border: 1px solid rgba(124,58,237,.3);\n  border-radius: 8px;\n  padding: 7px 14px;\n}\n.q-badge svg { width: 13px; height: 13px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n/* reveal helper */\n.rv { opacity: 0; transform: translateY(14px); transition: opacity .7s var(--ease), transform .7s var(--ease); }\n.rv.in { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }\n\n@media (max-width: 760px) {\n  body { padding: 32px 16px 80px; }\n  .qpad { padding: 36px 24px; }\n}\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════\n   SECTION A — \"Why corporate clients switch\"\n   A1 · The Switch (interactive master toggle)\n   A2 · Before → After transformation rows\n════════════════════════════════════════════════ */\n\n/* ─────────────── A1 · THE SWITCH ─────────────── */\n.sw {\n  --tint: var(--accent);\n}\n.sw-top {\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 28px;\n  flex-wrap: wrap;\n  margin-bottom: 44px;\n}\n.sw-top .eyebrow { margin-bottom: 14px; }\n.sw-top h2 { max-width: 16ch; }\n\n/* segmented physical toggle */\n.sw-toggle {\n  position: relative;\n  display: inline-flex;\n  background: var(--bg2);\n  border: 1px solid var(--line2);\n  border-radius: 12px;\n  padding: 5px;\n  gap: 2px;\n  user-select: none;\n}\n.sw-toggle .sw-knob {\n  position: absolute;\n  top: 5px; bottom: 5px;\n  left: 5px;\n  width: calc(50% - 5px);\n  background: var(--bg4);\n  border: 1px solid var(--line2);\n  border-radius: 9px;\n  transition: transform .5s var(--ease-spring), background .4s var(--ease), border-color .4s var(--ease);\n  z-index: 0;\n}\n.sw[data-state=\"new\"] .sw-knob {\n  transform: translateX(100%);\n  background: rgba(124,58,237,.18);\n  border-color: rgba(124,58,237,.5);\n  box-shadow: inset 0 0 0 1px rgba(154,92,255,.25), 0 0 24px rgba(124,58,237,.25);\n}\n.sw-opt {\n  position: relative; z-index: 1;\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: var(--ff-mono);\n  font-size: 12px;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--ink-faint);\n  background: none; border: none; cursor: pointer;\n  padding: 10px 20px;\n  border-radius: 9px;\n  transition: color .3s var(--ease);\n  white-space: nowrap;\n}\n.sw-opt .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); transition: background .3s, box-shadow .3s; }\n.sw[data-state=\"old\"] .sw-opt.old { color: var(--ink); }\n.sw[data-state=\"old\"] .sw-opt.old .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }\n.sw[data-state=\"new\"] .sw-opt.new { color: var(--ink); }\n.sw[data-state=\"new\"] .sw-opt.new .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }\n\n/* rows */\n.sw-rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }\n.sw-row {\n  display: grid;\n  grid-template-columns: 56px 1fr 232px;\n  align-items: center;\n  gap: 28px;\n  padding: 30px 4px;\n  border-bottom: 1px solid var(--line);\n  transition: background .4s var(--ease);\n}\n.sw[data-state=\"old\"] .sw-row { background: linear-gradient(90deg, rgba(192,73,47,.05), transparent 60%); }\n.sw-idx {\n  font-family: var(--ff-mono);\n  font-size: 13px;\n  font-weight: 700;\n  color: var(--ink-faint);\n  transition: color .4s;\n}\n.sw[data-state=\"old\"] .sw-idx { color: var(--red); }\n.sw[data-state=\"new\"] .sw-idx { color: var(--accent); }\n\n/* stacked statements — cross-fade */\n.sw-text { position: relative; }\n.sw-line { transition: opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease); }\n.sw-line.old {\n  font-family: var(--ff-mono);\n  font-size: 16px;\n  line-height: 1.5;\n  color: var(--ink-faint);\n  text-decoration: line-through;\n  text-decoration-color: rgba(192,73,47,.55);\n  max-width: 46ch;\n}\n.sw-line.new {\n  font-family: var(--ff-head);\n  font-size: 22px;\n  font-weight: 500;\n  letter-spacing: -.02em;\n  line-height: 1.2;\n  color: var(--ink);\n  max-width: 30ch;\n}\n/* OLD active: show old line, hide new (collapsed beneath) */\n.sw[data-state=\"old\"] .sw-line.new { position: absolute; opacity: 0; transform: translateY(8px); pointer-events: none; }\n.sw[data-state=\"old\"] .sw-line.old { opacity: 1; }\n/* NEW active: show new big, old shrinks to faint caption above */\n.sw[data-state=\"new\"] .sw-line.old { font-size: 12px; opacity: .5; margin-bottom: 8px; }\n.sw[data-state=\"new\"] .sw-line.new { opacity: 1; }\n\n/* right metric flip */\n.sw-metric {\n  justify-self: end;\n  text-align: right;\n  border-left: 1px solid var(--line);\n  padding-left: 28px;\n  min-width: 200px;\n}\n.sw-metric .m-cap {\n  font-family: var(--ff-mono);\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--ink-faint);\n  margin-bottom: 8px;\n}\n.sw-metric .m-val {\n  font-family: var(--ff-head);\n  font-weight: 600;\n  font-size: 30px;\n  letter-spacing: -.02em;\n  line-height: 1;\n  transition: color .4s var(--ease), opacity .4s var(--ease);\n}\n.sw-metric .m-old { color: var(--red); position: relative; display: inline-block; }\n.sw-metric .m-old::after {\n  content: ''; position: absolute; left: -2px; right: -2px; top: 52%;\n  height: 2px; background: rgba(192,73,47,.6);\n  transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease) .1s;\n}\n.sw[data-state=\"old\"] .sw-metric .m-old::after { transform: scaleX(1); }\n.sw-metric .m-new { color: var(--accent); }\n.sw[data-state=\"old\"] .m-new, .sw[data-state=\"old\"] .m-cap.cap-new { display: none; }\n.sw[data-state=\"new\"] .m-old, .sw[data-state=\"new\"] .m-cap.cap-old { display: none; }\n.sw-metric .m-val small { font-size: 16px; font-weight: 500; opacity: .7; }\n\n@media (max-width: 860px) {\n  .sw-row { grid-template-columns: 40px 1fr; }\n  .sw-metric { grid-column: 1 / -1; justify-self: start; text-align: left; border-left: none; border-top: 1px solid var(--line); padding: 16px 0 0; margin-top: 4px; }\n  .sw-metric .m-val { font-size: 26px; }\n}\n\n/* ───────────── A2 · BEFORE → AFTER ───────────── */\n.ba-head { margin-bottom: 40px; }\n.ba-head .eyebrow { margin-bottom: 12px; }\n.ba-head h2 { max-width: 18ch; }\n\n.ba-rows { display: flex; flex-direction: column; gap: 22px; }\n.ba-row {\n  display: grid;\n  grid-template-columns: 1fr 64px 1.08fr;\n  align-items: stretch;\n  gap: 0;\n}\n.ba-card {\n  border-radius: 14px;\n  padding: 26px 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  min-height: 150px;\n}\n.ba-old {\n  background: var(--bg2);\n  border: 1px dashed var(--line2);\n  transition: opacity .6s var(--ease) .05s, transform .6s var(--ease) .05s;\n}\n.ba-row .ba-old { opacity: 0; transform: translateX(-16px); }\n.ba-row.in .ba-old { opacity: 1; transform: none; }\n.ba-new {\n  position: relative;\n  background:\n    linear-gradient(var(--bg2), var(--bg2)) padding-box,\n    linear-gradient(135deg, rgba(124,58,237,.5), var(--line2) 55%) border-box;\n  border: 1px solid transparent;\n  overflow: hidden;\n  transition: opacity .6s var(--ease) .45s, transform .6s var(--ease) .45s;\n}\n.ba-row .ba-new { opacity: 0; transform: translateX(16px); }\n.ba-row.in .ba-new { opacity: 1; transform: none; }\n.ba-new : flex; align-items: flex-end; gap: 4px; height: 30px; }\n.scr-w .w-spark i { flex: 1; background: var(--accent); border-radius: 2px; opacity: .8; }\n.scr-w .w-dots { display: flex; gap: 5px; }\n.scr-w .w-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .35; }\n.scr-w .w-dots i.lit { opacity: 1; box-shadow: 0 0 8px var(--accent); }\n\n/* — vendors: network ripple — */\n.scr-net { position: relative; height: 100%; min-height: 320px; }\n.net-ring { position: absolute; top: 50%; left: 50%; width: 280px; height: 280px; margin: -140px 0 0 -140px; border: 1px dashed var(--line2); border-radius: 50%; }\n.net-hub { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 14px; background: rgba(124,58,237,.15); border: 1px solid rgba(124,58,237,.5); display: flex; align-items: center; justify-content: center; z-index: 3; }\n.net-hub svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.6; }\n.net-pulse { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0; }\n.bx-panel.show .net-pulse { animation: netPulse 2.6s var(--ease) infinite; }\n.bx-panel.show .net-pulse.d2 { animation-delay: 1.3s; }\n@keyframes netPulse { 0% { opacity:.6; transform: scale(1);} 70%{opacity:0;} 100% { opacity:0; transform: scale(4.2);} }\n.net-node { position: absolute; width: 46px; height: 46px; border-radius: 11px; background: var(--bg3); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; z-index: 2; transition: all .4s var(--ease); }\n.net-node svg { width: 18px; height: 18px; stroke: var(--ink-faint); fill: none; stroke-width: 1.7; }\n.net-node .chk { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.4); transition: all .3s var(--ease-spring); }\n.net-node .chk svg { width: 10px; height: 10px; stroke: #06281c; stroke-width: 3; }\n.bx-panel.show .net-node { animation: nodeNotify 5.2s ease infinite; animation-delay: var(--d, 0s); }\n@keyframes nodeNotify {\n  0%, 6% { border-color: var(--line2); background: var(--bg3); }\n  14%, 60% { border-color: rgba(124,58,237,.5); background: rgba(124,58,237,.12); }\n  100% { border-color: var(--line2); background: var(--bg3); }\n}\n.bx-panel.show .net-node .chk { animation: chkPop 5.2s ease infinite; animation-delay: var(--d, 0s); }\n@keyframes chkPop { 0%,8%{opacity:0;transform:scale(.4);} 16%,58%{opacity:1;transform:scale(1);} 66%,100%{opacity:0;transform:scale(.4);} }\n\n/* — reporting: bars — */\n.scr-rep { display: flex; flex-direction: column; height: 100%; gap: 16px; }\n.rep-legend { display: flex; gap: 18px; }\n.rep-legend span { display: flex; align-items: center; gap: 8px; font-family: var(--ff-mono); font-size: 11px; color: var(--ink-soft); }\n.rep-legend i { width: 11px; height: 11px; border-radius: 3px; }\n.rep-legend i.prom { background: var(--line2); }\n.rep-legend i.del { background: var(--accent); }\n.rep-chart { flex: 1; display: flex; align-items: flex-end; gap: 20px; padding-top: 8px; border-bottom: 1px solid var(--line); }\n.rep-col { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 100%; }\n.rep-bar { width: 26px; border-radius: 5px 5px 0 0; height: 0; align-self: flex-end; }\n.rep-bar.prom { background: var(--line2); }\n.rep-bar.del { background: linear-gradient(180deg, var(--accent-bright), var(--accent)); }\n.bx-panel.show .rep-bar { animation: barRise .8s var(--ease) forwards; }\n.bx-panel.show .rep-col:nth-child(2) .rep-bar{animation-delay:.1s;}\n.bx-panel.show .rep-col:nth-child(3) .rep-bar{animation-delay:.2s;}\n.bx-panel.show .rep-col:nth-child(4) .rep-bar{animation-delay:.3s;}\n@keyframes barRise { to { height: var(--h, 50%); } }\n.rep-labels { display: flex; gap: 20px; }\n.rep-labels span { flex: 1; text-align: center; font-family: var(--ff-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }\n\n@media (max-width: 860px) {\n  .bx-body { grid-template-columns: 1fr; }\n  .bx-screen { min-height: 380px; }\n}\n\n/* ─────────── B2 · CARDS WITH MICRO-ANIM ─────────── */\n.bc-top { margin-bottom: 36px; }\n.bc-top .q-badge { margin-bottom: 18px; }\n.bc-top h2 { max-width: 22ch; }\n.bc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n.bc-card {\n  background: var(--bg2);\n  border: 1px solid var(--line);\n  border-radius: 16px;\n  padding: 0;\n  overflow: hidden;\n  display: flex; flex-direction: column;\n  transition: border-color .25s, transform .25s var(--ease), box-shadow .25s;\n}\n.bc-card:hover { border-color: rgba(124,58,237,.4); transform: translateY(-4px); box-shadow: 0 16px 40px -20px rgba(124,58,237,.4); }\n.bc-viz {\n  height: 124px;\n  position: relative;\n  background:\n    radial-gradient(120% 120% at 50% 0%, rgba(124,58,237,.07), transparent 70%),\n    var(--bg3);\n  border-bottom: 1px solid var(--line);\n  overflow: hidden;\n  display: flex; align-items: center; justify-content: center;\n}\n.bc-body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }\n.bc-body h4 { font-family: var(--ff-head); font-size: 16px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }\n.bc-body p { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); flex: 1; }\n.bc-body .bc-tag { font-family: var(--ff-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-top: 4px; }\n\n/* viz: proposal lines */\n.v-prop { display: flex; flex-direction: column; gap: 7px; width: 76px; }\n.v-prop i { height: 7px; border-radius: 3px; background: var(--line2); transform-origin: left; animation: vpFill 2.6s var(--ease) infinite; }\n.v-prop i:nth-child(1){--vw:1;animation-delay:0s;}\n.v-prop i:nth-child(2){--vw:.7;animation-delay:.25s;}\n.v-prop i:nth-child(3){--vw:.85;animation-delay:.5s;}\n.v-prop i:nth-child(4){--vw:.55;animation-delay:.75s;background:var(--accent);}\n@keyframes vpFill { 0%{transform:scaleX(0);background:var(--line2);} 30%,70%{transform:scaleX(var(--vw));} 100%{transform:scaleX(0);} }\n.bc-card:hover .v-prop i { animation-duration: 1.6s; }\n\n/* viz: portal dots */\n.v-portal { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; width: 86px; }\n.v-portal i { aspect-ratio: 1; border-radius: 5px; background: var(--bg4); border: 1px solid var(--line2); animation: vpoBlink 3s ease infinite; }\n.v-portal i:nth-child(1){animation-delay:0s;}\n.v-portal i:nth-child(2){animation-delay:.3s;}\n.v-portal i:nth-child(3){animation-delay:.6s;}\n.v-portal i:nth-child(4){animation-delay:.9s;}\n.v-portal i:nth-child(5){animation-delay:1.2s;}\n.v-portal i:nth-child(6){animation-delay:1.5s;}\n@keyframes vpoBlink { 0%,100%{background:var(--bg4);border-color:var(--line2);} 50%{background:rgba(124,58,237,.25);border-color:rgba(124,58,237,.5);} }\n\n/* viz: vendor ping */\n.v-net { position: relative; width: 110px; height: 80px; }\n.v-net .vhub { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 10px rgba(124,58,237,.6); z-index: 2; }\n.v-net .vping { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 1.5px solid var(--accent); animation: netPulse 2.4s var(--ease) infinite; }\n.v-net .vn { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--line2); animation: vnLit 2.4s ease infinite; }\n.v-net .vn:nth-child(3){top:6px;left:6px;animation-delay:.5s;}\n.v-net .vn:nth-child(4){top:6px;right:6px;animation-delay:.8s;}\n.v-net .vn:nth-child(5){bottom:6px;left:14px;animation-delay:1.1s;}\n.v-net .vn:nth-child(6){bottom:6px;right:14px;animation-delay:1.4s;}\n@keyframes vnLit { 0%,30%{background:var(--line2);} 45%,75%{background:var(--accent);box-shadow:0 0 8px var(--accent);} 100%{background:var(--line2);} }\n\n/* viz: reporting bars */\n.v-rep { display: flex; align-items: flex-end; gap: 6px; height: 64px; }\n.v-rep i { width: 12px; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--accent-bright), var(--accent)); animation: vrep 2.8s var(--ease) infinite; }\n.v-rep i:nth-child(1){--vh:40%;animation-delay:0s;}\n.v-rep i:nth-child(2){--vh:70%;animation-delay:.15s;}\n.v-rep i:nth-child(3){--vh:55%;animation-delay:.3s;}\n.v-rep i:nth-child(4){--vh:90%;animation-delay:.45s;}\n.v-rep i:nth-child(5){--vh:65%;animation-delay:.6s;}\n@keyframes vrep { 0%{height:0;} 35%,70%{height:var(--vh);} 100%{height:0;} }\n\n@media (max-width: 860px) { .bc-grid { grid-template-columns: 1fr 1fr; } }\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════\n   SECTION C — \"What we run\"\n   C1 · Expanding gallery panels\n   C2 · Editorial hover-reveal index\n════════════════════════════════════════════════ */\n\n/* shared header */\n.cw-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 36px; }\n.cw-top .eyebrow { margin-bottom: 10px; }\n.cw-top h2 { max-width: 20ch; }\n\n/* ─────────── C1 · EXPANDING PANELS ─────────── */\n.cp-rail { display: flex; gap: 12px; height: 440px; }\n.cp-panel {\n  position: relative;\n  flex: 1;\n  min-width: 78px;\n  border: 1px solid var(--line);\n  border-radius: 16px;\n  overflow: hidden;\n  cursor: pointer;\n  background: var(--bg2);\n  transition: flex .6s var(--ease), border-color .35s var(--ease);\n}\n.cp-panel.on { flex: 3.4; border-color: rgba(124,58,237,.4); }\n.cp-panel:hover:not(.on) { border-color: var(--line2); }\n\n/* image bg (striped placeholder) */\n.cp-img {\n  position: absolute; inset: 0;\n  background:\n    repeating-linear-gradient(135deg, var(--bg3) 0 16px, var(--bg4) 16px 32px);\n  transition: transform .6s var(--ease), filter .6s var(--ease);\n  filter: saturate(.6) brightness(.7);\n}\n.cp-panel.on .cp-img { filter: saturate(1) brightness(.85); }\n.cp-img::after {\n  content: ''; position: absolute; inset: 0;\n  background: linear-gradient(180deg, rgba(15,14,12,.1) 0%, rgba(15,14,12,.55) 50%, rgba(15,14,12,.92) 100%);\n}\n.cp-img .cp-ph-tag {\n  position: absolute; top: 14px; left: 14px;\n  font-family: var(--ff-mono); font-size: 10px; letter-spacing: .04em;\n  color: var(--ink-faint); background: rgba(15,14,12,.6); border: 1px solid var(--line2);\n  border-radius: 5px; padding: 4px 9px; z-index: 2;\n}\n.cp-tint { position: absolute; inset: 0; opacity: 0; transition: opacity .6s var(--ease); mix-blend-mode: screen; }\n.cp-panel.on .cp-tint { opacity: .5; }\n\n/* collapsed spine label */\n.cp-spine {\n  position: absolute; inset: 0; z-index: 3;\n  display: flex; flex-direction: column; justify-content: space-between;\n  padding: 22px 0;\n  transition: opacity .35s var(--ease);\n}\n.cp-panel.on .cp-spine { opacity: 0; pointer-events: none; }\n.cp-spine .cp-snum { font-family: var(--ff-mono); font-size: 13px; font-weight: 700; color: var(--accent); text-align: center; }\n.cp-spine .cp-sname {\n  writing-mode: vertical-rl; transform: rotate(180deg);\n  margin: 0 auto;\n  font-family: var(--ff-head); font-size: 17px; font-weight: 600; letter-spacing: -.01em;\n  color: var(--ink); white-space: nowrap;\n}\n.cp-spine .cp-splus { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; margin: 0 auto; color: var(--ink-faint); font-size: 16px; }\n\n/* expanded content */\n.cp-content {\n  position: absolute; inset: 0; z-index: 3;\n  display: flex; flex-direction: column; justify-content: flex-end;\n  padding: 30px 32px;\n  opacity: 0; transform: translateY(10px);\n  transition: opacity .4s var(--ease) .15s, transform .4s var(--ease) .15s;\n  pointer-events: none;\n}\n.cp-panel.on .cp-content { opacity: 1; transform: none; pointer-events: auto; }\n.cp-content .cp-num { font-family: var(--ff-mono); font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }\n.cp-content h3 { font-size: 26px; margin-bottom: 10px; max-width: 14ch; }\n.cp-content p { font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); max-width: 38ch; margin-bottom: 18px; }\n.cp-content .cp-link { display: inline-flex; align-items: center; gap: 9px; align-self: flex-start; font-family: var(--ff-mono); font-size: 12px; letter-spacing: .04em; color: var(--ink); border: 1px solid var(--line2); background: rgba(15,14,12,.5); border-radius: 8px; padding: 9px 15px; transition: border-color .2s, background .2s; }\n.cp-content .cp-link:hover { border-color: var(--accent); background: rgba(124,58,237,.12); }\n.cp-content .cp-link .ar { transition: transform .3s var(--ease-spring); }\n.cp-content .cp-link:hover .ar { transform: translateX(3px); }\n\n@media (max-width: 860px) {\n  .cp-rail { flex-direction: column; height: auto; }\n  .cp-panel { min-height: 76px; }\n  .cp-panel.on { min-height: 320px; }\n  .cp-spine { flex-direction: row; align-items: center; padding: 0 22px; }\n  .cp-spine .cp-sname { writing-mode: horizontal-tb; transform: none; margin: 0 14px; }\n  .cp-spine .cp-snum, .cp-spine .cp-splus { margin: 0; }\n}\n\n/* ─────────── C2 · EDITORIAL INDEX ─────────── */\n.ci-wrap { position: relative; }\n.ci-list { border-top: 1px solid var(--line); }\n.ci-row {\n  position: relative;\n  display: grid;\n  grid-template-columns: 80px 1fr auto;\n  align-items: center;\n  gap: 28px;\n  padding: 26px 8px;\n  border-bottom: 1px solid var(--line);\n  cursor: pointer;\n  transition: padding .4s var(--ease), background .35s var(--ease);\n}\n.ci-list:hover .ci-row { opacity: .4; transition: opacity .35s var(--ease); }\n.ci-list .ci-row:hover { opacity: 1; padding-left: 24px; background: linear-gradient(90deg, rgba(124,58,237,.05), transparent 50%); }\n.ci-num { font-family: var(--ff-mono); font-size: 14px; font-weight: 700; color: var(--ink-faint); transition: color .3s; }\n.ci-row:hover .ci-num { color: var(--accent); }\n.ci-main { display: flex; flex-direction: column; gap: 6px; }\n.ci-name {\n  font-family: var(--ff-head);\n  font-size: clamp(24px, 3vw, 34px);\n  font-weight: 500; letter-spacing: -.025em; line-height: 1;\n  color: var(--ink-soft);\n  transition: color .3s var(--ease);\n}\n.ci-row:hover .ci-name { color: var(--ink); }\n.ci-desc { font-size: 14px; color: var(--ink-faint); max-width: 52ch; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .4s var(--ease), opacity .3s var(--ease), margin .4s var(--ease); }\n.ci-row:hover .ci-desc { max-height: 60px; opacity: 1; margin-top: 4px; }\n.ci-arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); transition: all .3s var(--ease-spring); flex-shrink: 0; }\n.ci-arrow svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n.ci-row:hover .ci-arrow { border-color: var(--accent); color: var(--accent); transform: rotate(-45deg) scale(1.05); background: rgba(124,58,237,.08); }\n\n/* floating preview */\n.ci-preview {\n  position: absolute;\n  top: 50%; right: 0;\n  width: 300px; height: 220px;\n  border-radius: 14px;\n  overflow: hidden;\n  border: 1px solid var(--line2);\n  pointer-events: none;\n  opacity: 0;\n  transform: translateY(-44%) scale(.96);\n  transition: opacity .35s var(--ease), transform .45s var(--ease);\n  z-index: 5;\n  box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);\n}\n.ci-preview.show { opacity: 1; transform: translateY(-50%) scale(1); }\n.ci-prev-img { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, var(--bg3) 0 16px, var(--bg4) 16px 32px); opacity: 0; transition: opacity .3s; }\n.ci-prev-img.on { opacity: 1; }\n.ci-prev-img::after { content: attr(data-label); position: absolute; left: 12px; bottom: 12px; font-family: var(--ff-mono); font-size: 10px; color: var(--ink-soft); background: rgba(15,14,12,.65); border: 1px solid var(--line2); border-radius: 5px; padding: 4px 9px; }\n.ci-prev-grain { position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(124,58,237,.12)); }\n\n@media (max-width: 980px) { .ci-preview { display: none; } }\n@media (min-width: 981px) { .ci-list { padding-right: 348px; } }\n@media (max-width: 760px) {\n  .ci-row { grid-template-columns: 48px 1fr auto; gap: 16px; }\n  .ci-desc { max-height: none; opacity: 1; margin-top: 8px; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ───────────── PAGE HEADER ───────────── -->\n<header class=\"ex-head\">\n  <div class=\"ex-kicker\">Quiet Loud · section explorations<\u002Fdiv>\n  <h1>Three sections, made to move and tell a story.<\u002Fh1>\n  <p>Two directions for each section, built in your live dark + grain + purple system. Toggle, hover, and watch them animate. Pick a direction per section — they mix and match, and I'll port the winners into the live site.<\u002Fp>\n  <div class=\"ex-legend\">\n    <span class=\"ex-legend-pill\">Interactive — click &amp; hover<\u002Fspan>\n    <span class=\"ex-legend-pill\">Animates on scroll-in<\u002Fspan>\n    <span class=\"ex-legend-pill\">Placeholders where photos would go<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═════════════════════════════════════════════════════\n     GROUP A — WHY CORPORATE CLIENTS SWITCH\n═════════════════════════════════════════════════════ -->\n<section class=\"ex-group\">\n  <div class=\"ex-group-head\">\n    <span class=\"ex-group-id\">A<\u002Fspan>\n    <h2>Why corporate clients switch<\u002Fh2>\n    <span class=\"note\">old way → Quiet Loud<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- A1 -->\n  <div class=\"frame\">\n    <div class=\"frame-label\">\n      <span clas
